[tool.uv.workspace]
members = [
    "Bookly",
]

[project.scripts]
bookly = "src:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Bookly"
version = "0.1.1"
description = "A Book Management Application built with FastAPI."
readme = "README.md"
authors = [
    { name = "Ali Hussain Abid", email = "alihussainabid@hotmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi[all]",
    "pydantic-settings",
    "pydantic-extra-types",
    "sqlmodel",
    "sqlalchemy",
    "asyncpg",
    "python-dotenv",
    "python-multipart",
    "sentry-sdk",
    "alembic",
    "passlib",
    "pycountry",
]

###############################################################################
# Optional Dependency Groups
###############################################################################

[project.optional-dependencies]

dev = [
    # Linting & Formatting
    "ruff",
    "mypy",
    "pre-commit",

    # Testing & Coverage
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "httpx",

    # Documentation
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocstrings-python",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-mermaid2-plugin",
    "griffe",
]

###############################################################################
# Ruff (Linter & Formatter)
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "D",     # pydocstyle
]
unfixable = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

###############################################################################
# MyPy (Type Checker)
###############################################################################

[tool.mypy]
python_version = "3.12"
strict = true

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true

pretty = true
mypy_path = "src"

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]
branch = true
source = [
    "src",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

###############################################################################
# Hatch / Build Configuration
###############################################################################

[tool.hatch.build.targets.wheel]
packages = ["src/bookly"]

###############################################################################
# MkDocs
###############################################################################

[tool.mkdocs]
site_name = "Book Management"
docs_dir = "docs"

