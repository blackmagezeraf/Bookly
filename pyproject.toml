[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "book-management"
version = "0.1.0"
description = "A Book Management Application built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

authors = [
    { name = "Ali Hussain Abid", email = "alihussainabid@hotmail.com" }
]

dependencies = [
    "fastapi[all]>=0.139.0",
    "pydantic-settings>=2.14.2",
    "pydantic-extra-types>=2.11.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.65.0",
    "tqdm>=4.68.4",
]

###############################################################################
# Optional Dependency Groups
###############################################################################

[project.optional-dependencies]

dev = [
    # Linting & Formatting
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",

    # Testing & Coverage
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",

    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mkdocstrings-python>=2.0.5",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-section-index>=0.3.12",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "griffe>=2.1.0",
]

###############################################################################
# Ruff (Linter & Formatter)
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "D",     # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

###############################################################################
# MyPy (Type Checker)
###############################################################################

[tool.mypy]
python_version = "3.12"
strict = true

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true

pretty = true
mypy_path = "src"

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]
branch = true
source = [
    "src",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

###############################################################################
# Hatch / Build Configuration
###############################################################################

[tool.hatch.build.targets.wheel]
packages = ["src/bookly"]

###############################################################################
# MkDocs
###############################################################################

[tool.mkdocs]
site_name = "Book Management"
docs_dir = "docs"